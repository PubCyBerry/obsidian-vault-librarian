name: Nightly tests

# The tests too slow for every push: the property-based tests with many more cases than a push
# runs, and mutation testing, which runs the tests once for every change Stryker makes to the
# source. A pull request that changes this file or the Stryker config runs them too, since a
# schedule only ever runs what is on the default branch.
#
# The schedule fires every night, but the tests run only when the default branch has changed
# since the last night they passed: GitHub has no schedule that fires on change alone.
on:
    schedule:
        # 18:00 UTC is 03:00 in Seoul.
        - cron: '0 18 * * *'
    workflow_dispatch:
    pull_request:
        paths:
            - .github/workflows/nightly.yml
            - stryker.config.json

permissions:
    contents: read

concurrency:
    group: nightly-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changed:
        name: Anything new since the last night that passed
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: read
        outputs:
            run: ${{ steps.check.outputs.run }}
        steps:
            - id: check
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  run=true
                  if [ "$GITHUB_EVENT_NAME" = schedule ]; then
                      # A night that was skipped passes too, with the same commit, so the commit
                      # of the last scheduled run that passed is the last one that was tested.
                      last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --event schedule --status success --limit 1 --json headSha --jq ".[0].headSha // empty")
                      echo "last tested: ${last:-none}, now: $GITHUB_SHA"
                      if [ "$last" = "$GITHUB_SHA" ]; then run=false; fi
                  fi
                  echo "run=$run" >> "$GITHUB_OUTPUT"
                  [ "$run" = true ] || echo "No change since the last night that passed: skipped." >> "$GITHUB_STEP_SUMMARY"

    property:
        name: Property-based tests, many cases
        needs: changed
        if: needs.changed.outputs.run == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: 'npm'
            - run: npm ci
            # Every test file: the properties are not all in files of their own. The build comes
            # first because tests/bundle.test.ts reads main.js.
            - run: npm run build
            - run: npx vitest --run --testTimeout=600000
              env:
                  FC_NUM_RUNS: 20000

    mutation:
        name: Mutation tests (${{ matrix.scope }})
        needs: changed
        if: needs.changed.outputs.run == 'true'
        runs-on: ubuntu-latest
        # One folder of src to a runner, so the folders run side by side: the longest took 16
        # minutes on its first run, with nothing in the cache.
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                scope:
                    - agent
                    - context
                    - mcp
                    - permissions
                    - provider
                    - session
                    - settings
                    - shell
                    - skills
                    - storage
                    - tools
                    - ui
                    - webdav
                    - root
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: 'npm'
            - run: npm ci
            # What the run before found, so that only mutants of changed code and changed tests
            # are tested again. A cache is never overwritten, hence a new key on every run.
            - uses: actions/cache@v6
              with:
                  path: reports/stryker-incremental.json
                  key: stryker-${{ matrix.scope }}-${{ github.run_id }}
                  restore-keys: stryker-${{ matrix.scope }}-
            # Vitest writes a "Vitest Test Report" to the run summary each time it ends, and
            # Stryker runs it over and over: without the variable the summary stays free for
            # the one report the last job writes.
            - run: env -u GITHUB_STEP_SUMMARY npx stryker run --mutate "$MUTATE"
              env:
                  MUTATE: ${{ matrix.scope == 'root' && 'src/*.ts' || format('src/{0}/**/*.ts', matrix.scope) }}
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: mutation-report-${{ matrix.scope }}
                  path: reports/mutation
                  retention-days: 14

    report:
        name: Mutation report
        needs: [changed, mutation]
        # Also when a folder failed: the report then covers the folders that finished.
        if: always() && needs.changed.outputs.run == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/download-artifact@v8
              with:
                  pattern: mutation-report-*
                  path: reports
            # In the log as well, for whoever reads the run from a terminal.
            - run: node scripts/mutation-summary.mjs reports | tee -a "$GITHUB_STEP_SUMMARY"
