# See https://prek.j178.dev for more information.
# yaml-language-server: $schema=https://www.schemastore.org/prek.json

# The bundle and the lock file are generated, so no hook touches them.
exclude: ^(main\.js|package-lock\.json)$

repos:
  # Commit messages must be Conventional Commits. release-please derives the version bump and
  # the CHANGELOG section from the type, so a message that breaks the convention breaks a release.
  # The rules are in commitlint.config.mjs; the shared config it extends is installed into the hook env.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional@^21.2.3']

  # Formatting and general JS/TS lint. Obsidian-specific rules are eslint-plugin-obsidianmd's job.
  # rev is the Biome version, so bump it together with @biomejs/biome in package.json.
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.14
    hooks:
      - id: biome-check
